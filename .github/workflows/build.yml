name: Build & Release

# Builds a distributable Windows build of FfxTool.Gui and attaches it to a
# GitHub Release. Runs on version tags (v*) or manual dispatch — a manual
# run with a version number typed into the input releases exactly that
# version (the tag is created on the built commit); an empty input builds
# an artifact without publishing anything.
#
# On a release run the description is written by the notes bot: it reads
# the commit subjects between the previous release tag and the commit
# being released — the whole history when no earlier release exists — and
# turns them into a changelog that reads like one: multi-entry commit
# messages are split so every change gets its own bullet, identical
# repeated entries fold into their first appearance, GitHub's "Add files
# via upload" commits collapse into a single line, every subject is cut
# to its pre-em-dash summary and capped at a word boundary, and install
# steps plus the SHA-256 of the attached exe are added. GitHub's own
# generated notes (the compare link) are appended on top of that body.
#
# Note on why this is simpler than the old Python/PyInstaller build.yml:
# .NET Framework (net48) apps don't need PyInstaller-style bundling. A
# Release build runs the csproj's ILRepack step, which merges every
# dependency DLL (FfxTool.Core, the System.Text.Json chain) into
# FFXCompatibilityTool.exe itself, and the seed tables ship embedded
# inside FfxTool.Core — so the output folder is exactly one runnable
# .exe, packed under its product name and shipped as-is: no zip around
# it, the exe IS the download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to build and release (e.g. 0.2.0 — a leading v is fine). Empty = build + artifact, no release."
        required: false
        default: ""

# the release step publishes with the default token — without this block
# a read-only default would 403 the very first v* tag's release
permissions:
  contents: write

jobs:
  build:
    # windows-latest specifically: has the .NET Framework 4.8 targeting
    # pack pre-installed, required to build net48 projects at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes bot walks the history between the previous tag and
          # this one — a shallow clone would have nothing to read
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve the release tag
        id: ver
        shell: bash
        run: |
          # A v* tag push releases that tag. A manual dispatch releases the
          # version typed into the input, normalized to v<version> — the
          # release step creates the tag on this exact commit through the
          # API (an API-created ref, so it cannot re-trigger this workflow).
          # An empty input keeps a dispatch artifact-only.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ inputs.version }}"
            V="${V#v}"
            if [ -z "$V" ]; then
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "buildargs=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="v${V}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "buildargs=/p:Version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        # FfxTool.sln now includes FfxTool.Gui — single restore covers all projects
        run: dotnet restore FfxTool.sln

      - name: Run tests before packaging
        run: dotnet test FfxTool.sln --configuration Release

      - name: Build (Release)
        # Build via the solution so Core + Gui share the same Release output
        # handling; /p:Version stamps the assembly (About box + update checks)
        # to match the released tag — empty for artifact-only dispatch runs
        run: dotnet build FfxTool.sln --configuration Release --no-restore ${{ steps.ver.outputs.buildargs }}

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $outDir = Get-ChildItem -Path "FfxTool.Gui\bin\Release" -Recurse -Filter "FFXCompatibilityTool.exe" |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $outDir) { throw "Could not find FFXCompatibilityTool.exe under FfxTool.Gui\bin\Release" }
          echo "outdir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Pack the single exe
        id: pack
        shell: pwsh
        run: |
          # the output folder holds exactly one file — the merged exe —
          # and it ships under its product name, no zip around it. A
          # release run carries the version (FFXCompatibilityTool-0.1.0.exe);
          # an artifact-only dispatch run falls back to a stable name.
          $tag = "${{ steps.ver.outputs.tag }}"
          if ($tag) { $exeName = "FFXCompatibilityTool-$($tag.TrimStart('v')).exe" }
          else { $exeName = "FFXCompatibilityTool-windows.exe" }
          Copy-Item "${{ steps.locate.outputs.outdir }}\FFXCompatibilityTool.exe" -Destination $exeName
          echo "exename=$exeName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFXCompatibilityTool-windows
          path: ${{ steps.pack.outputs.exename }}

      - name: Generate the release description
        if: steps.ver.outputs.tag != ''
        shell: bash
        env:
          EXENAME: ${{ steps.pack.outputs.exename }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # nearest release tag reachable from the parent of the commit
          # being released — the new tag itself is NOT in the local repo
          # yet (it is created by the API in the release step below), so
          # the anchor is HEAD's parent; --match 'v*' keeps the moving
          # nightly tag from ever acting as a changelog boundary. Empty
          # when this is the first release ever (then the range is the
          # whole history, which is honest for a first release)
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 'HEAD^' 2>/dev/null || true)"
          RANGE=""
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; fi
          SUM="$(sha256sum "${{ steps.pack.outputs.exename }}" | cut -d' ' -f1)"
          {
            echo "FFX Compatibility Tool ${TAG} — the portable Windows build."
            echo ""
            echo "## What's changed"
            echo ""
            # a release must not die over its own description — if the
            # commit log cannot be read, the fallback bullet publishes it
            git log ${RANGE:+"$RANGE"} --format='%s' \
              | sed -E 's/ and (chore|feat|fix|ci|docs|test|build|refactor|perf)\(/\n\1(/g' \
              | awk '
                # a changelog, not a raw git log: "Add files via upload"
                # commits collapse into one line, the em-dash detail tail
                # of a subject is dropped (git log itself keeps it),
                # anything still long is capped at a word boundary, and
                # identical RESULTING bullets fold into their first
                # appearance — two commits that summarize the same get one
                # line between them
                {
                  if ($0 == "Add files via upload") { uploads++; next }
                  sub(/ — .*$/, "")
                  if (length($0) > 100) {
                    s = substr($0, 1, 100)
                    i = 100
                    while (i > 40 && substr(s, i, 1) != " ") i--
                    if (i > 40) s = substr(s, 1, i - 1)
                    $0 = s "…"
                  }
                  if (seen[$0]++) { next }
                  print "- " $0
                }
                END {
                  if (uploads > 0)
                    print "- (" uploads " repository file uploads kept the tree in sync between these changes)"
                }
              ' > release_commits.txt || true
            if [ -s release_commits.txt ]; then
              cat release_commits.txt
            else
              echo "- (no commit notes could be read for this range)"
            fi
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download **${EXENAME}** below — that single file is the whole app."
            echo "2. Run it — no installer, no zip, no DLL pile, no data folder: everything is inside the exe."
            echo "3. Requires .NET Framework 4.8 (preinstalled on Windows 10/11; Windows 7 SP1 needs the 4.8 runtime installed once)."
            echo '4. Windows shows a "publisher could not be verified" warning on first run — this app is unsigned open source, and Windows says that about every fresh download. Match the SHA-256 above, then click **Run**.'
            echo "5. If the prompt gets old: right-click the exe → Properties → tick **Unblock**."
            echo ""
            echo "## Verify"
            echo ""
            echo '```'
            echo "SHA-256  ${SUM}  ${EXENAME}"
            echo '```'
            echo ""
            echo "The in-app **Check for Updates** (Settings → About) resolves this releases page — publishing a release is what announces the new version to installed builds."
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # a tag push: the tag exists and target_commitish is ignored.
          # a dispatch: the tag is created here, on the commit that was
          # just built and tested (API-created → no workflow re-trigger)
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FFX Compatibility Tool ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.pack.outputs.exename }}
          fail_on_unmatched_files: true
          generate_release_notes: true
