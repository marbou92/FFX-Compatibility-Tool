name: Build & Release

# Builds a distributable Windows build of FfxTool.Gui and attaches it to a
# GitHub Release. Runs on version tags (v*) or manual dispatch — a manual
# run with a version number typed into the input releases exactly that
# version (the tag is created on the built commit); an empty input builds
# an artifact without publishing anything.
#
# On a release run the page follows the vivi-music pattern: a curated
# per-release file — Changelog/Stablemd/<version without the leading
# v>.md (Changelog/Stablemd/0.3.0.md for tag v0.3.0), written for users,
# not committers — becomes the body verbatim, the install steps and the
# SHA-256 of the attached exe follow, the commit-derived list folds into
# a <details> block, and a Support section closes the page. The same
# curated file is parsed into a machine-readable changelog.json (the
# second half of the vivi pattern) and attached to the release as a
# second asset: installed builds download it from the permanent
# releases/latest/download/changelog.json URL to show the what's-new
# notes in the About page and the in-app updater, and to learn the new
# exe's exact file name and SHA-256 so the updater can verify what it
# downloaded. Without that file the body falls back to the plain
# commit-derived changelog:
# multi-entry commit messages are split so every change gets its own
# bullet, identical repeated entries fold into their first appearance,
# GitHub's "Add files via upload" commits collapse into a single line,
# and every subject is cut to its pre-em-dash summary and capped at a
# word boundary. GitHub's own generated notes (the compare link) are
# appended on top of the body either way, and an already-existing
# release is skipped politely instead of dying on a re-run.
#
# Note on why this is simpler than the old Python/PyInstaller build.yml:
# .NET Framework (net48) apps don't need PyInstaller-style bundling. A
# Release build runs the csproj's ILRepack step, which merges every
# dependency DLL (FfxTool.Core, the System.Text.Json chain) into
# FFXCompatibilityTool.exe itself, and the seed tables ship embedded
# inside FfxTool.Core — so the output folder is exactly one runnable
# .exe, packed under its product name and shipped as-is: no zip around
# it, the exe IS the download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to build and release (e.g. 0.2.0 — a leading v is fine). Empty = build + artifact, no release."
        required: false
        default: ""

# the release step publishes with the default token — without this block
# a read-only default would 403 the very first v* tag's release
permissions:
  contents: write

jobs:
  build:
    # windows-latest specifically: has the .NET Framework 4.8 targeting
    # pack pre-installed, required to build net48 projects at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes bot walks the history between the previous tag and
          # this one — a shallow clone would have nothing to read
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve the release tag
        id: ver
        shell: bash
        run: |
          # A v* tag push releases that tag. A manual dispatch releases the
          # version typed into the input, normalized to v<version> — the
          # release step creates the tag on this exact commit through the
          # API (an API-created ref, so it cannot re-trigger this workflow).
          # An empty input keeps a dispatch artifact-only.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ inputs.version }}"
            V="${V#v}"
            if [ -z "$V" ]; then
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "buildargs=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="v${V}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "buildargs=/p:Version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        # FfxTool.sln now includes FfxTool.Gui — single restore covers all projects
        run: dotnet restore FfxTool.sln

      - name: Run tests before packaging
        run: dotnet test FfxTool.sln --configuration Release

      - name: Build (Release)
        # Build via the solution so Core + Gui share the same Release output
        # handling; /p:Version stamps the assembly (About box + update checks)
        # to match the released tag — empty for artifact-only dispatch runs
        run: dotnet build FfxTool.sln --configuration Release --no-restore ${{ steps.ver.outputs.buildargs }}

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $outDir = Get-ChildItem -Path "FfxTool.Gui\bin\Release" -Recurse -Filter "FFXCompatibilityTool.exe" |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $outDir) { throw "Could not find FFXCompatibilityTool.exe under FfxTool.Gui\bin\Release" }
          echo "outdir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Pack the single exe
        id: pack
        shell: pwsh
        run: |
          # the output folder holds exactly one file — the merged exe —
          # and it ships under its product name, no zip around it. A
          # release run carries the version (FFXCompatibilityTool-0.1.0.exe);
          # an artifact-only dispatch run falls back to a stable name.
          $tag = "${{ steps.ver.outputs.tag }}"
          if ($tag) { $exeName = "FFXCompatibilityTool-$($tag.TrimStart('v')).exe" }
          else { $exeName = "FFXCompatibilityTool-windows.exe" }
          Copy-Item "${{ steps.locate.outputs.outdir }}\FFXCompatibilityTool.exe" -Destination $exeName
          echo "exename=$exeName" >> $env:GITHUB_OUTPUT

      - name: Generate changelog.json (the in-app update feed)
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          EXENAME: ${{ steps.pack.outputs.exename }}
        run: |
          # The vivi-music pattern, second half: the same curated
          # Changelog/Stablemd/<version>.md that becomes the release body
          # is parsed into a machine-readable changelog.json and attached
          # to the release as an asset beside the exe. Installed builds
          # fetch it from releases/latest/download/changelog.json (a plain
          # file redirect — no API, no rate limit) for the what's-new
          # notes, the exe file name and the SHA-256. Schema (a superset
          # of vivi's; unknown keys are ignored by older builds):
          #   version     "0.3.0"
          #   description the brings-sentence (or a description:: line)
          #   date        release day, yyyy-MM-dd
          #   url         the release page
          #   file        the exe asset's exact file name
          #   sha256      the exe's hash
          #   changelog   [{title, items[]}] — one per ## section
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = $tag.TrimStart("v")
          $mdPath = "Changelog/Stablemd/$version.md"

          $sections = New-Object System.Collections.Generic.List[object]
          $descriptionOverride = $null
          $descParts = New-Object System.Collections.Generic.List[string]
          $titleSeen = $false
          $curTitle = $null
          $curItems = $null

          function Flush-Section {
            if ($script:curTitle -ne $null) {
              $script:sections.Add([pscustomobject]@{ title = $script:curTitle; items = @($script:curItems.ToArray()) })
              $script:curTitle = $null
              $script:curItems = $null
            }
          }

          if (Test-Path $mdPath) {
            foreach ($raw in Get-Content -Path $mdPath -Encoding UTF8) {
              $line = $raw.TrimEnd()
              if ($line -match '^description::(.*)$') { $descriptionOverride = $Matches[1].Trim(); continue }
              if ($line -match '^image::') { continue }
              if ($line -match '^#\s') { continue }
              if ($line -match '^##\s+(.+)$') {
                if (-not $titleSeen) { $titleSeen = $true; continue }
                Flush-Section
                $curTitle = $Matches[1].Trim()
                $curItems = New-Object System.Collections.Generic.List[string]
                continue
              }
              if ($line -match '^[-*\u2022]+\s+(.+)$') {
                if ($null -ne $curItems) { $curItems.Add($Matches[1].Trim()) } 
                continue
              }
              $t = $line.Trim()
              if ($t -and $titleSeen -and ($curTitle -eq $null)) { $descParts.Add($t) }
            }
            Flush-Section
          }

          if ($sections.Count -eq 0) {
            $sections.Add([pscustomobject]@{ title = "What's New"; items = @("Bug fixes and performance improvements.") })
          }
          if ($descriptionOverride) { $description = $descriptionOverride }
          elseif ($descParts.Count -gt 0) { $description = $descParts[0] }
          else { $description = "FFX Compatibility Tool $version brings new features, fixes and polish." }

          $sha = (Get-FileHash -Algorithm SHA256 -Path $env:EXENAME).Hash.ToLowerInvariant()
          $feed = [ordered]@{
            version = $version
            description = $description
            date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            file = $env:EXENAME
            sha256 = $sha
            changelog = $sections.ToArray()
          }
          ConvertTo-Json -InputObject $feed -Depth 6 | Set-Content -Path changelog.json -Encoding utf8
          Write-Host "changelog.json written for $version ($($sections.Count) section(s))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFXCompatibilityTool-windows
          path: ${{ steps.pack.outputs.exename }}

      - name: Generate the release description
        if: steps.ver.outputs.tag != ''
        shell: bash
        env:
          EXENAME: ${{ steps.pack.outputs.exename }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # nearest release tag reachable from the parent of the commit
          # being released — the new tag itself is NOT in the local repo
          # yet (it is created by the API in the release step below), so
          # the anchor is HEAD's parent; --match 'v*' keeps the moving
          # nightly tag from ever acting as a changelog boundary. Empty
          # when this is the first release ever (then the range is the
          # whole history, which is honest for a first release)
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 'HEAD^' 2>/dev/null || true)"
          RANGE=""
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; fi
          SUM="$(sha256sum "${{ steps.pack.outputs.exename }}" | cut -d' ' -f1)"
          {
            # a release must not die over its own description — if the
            # commit log cannot be read, the fallback bullet publishes it.
            # the list is built unconditionally: without a curated notes
            # file it IS the changelog, with one it becomes the folded
            # tail of the page
            git log ${RANGE:+"$RANGE"} --format='%s' \
              | sed -E 's/ and (chore|feat|fix|ci|docs|test|build|refactor|perf)\(/\n\1(/g' \
              | awk '
                # a changelog, not a raw git log: "Add files via upload"
                # commits collapse into one line, the em-dash detail tail
                # of a subject is dropped (git log itself keeps it),
                # anything still long is capped at a word boundary, and
                # identical RESULTING bullets fold into their first
                # appearance — two commits that summarize the same get one
                # line between them
                {
                  if ($0 == "Add files via upload") { uploads++; next }
                  sub(/ — .*$/, "")
                  if (length($0) > 100) {
                    s = substr($0, 1, 100)
                    i = 100
                    while (i > 40 && substr(s, i, 1) != " ") i--
                    if (i > 40) s = substr(s, 1, i - 1)
                    $0 = s "…"
                  }
                  if (seen[$0]++) { next }
                  print "- " $0
                }
                END {
                  if (uploads > 0)
                    print "- (" uploads " repository file uploads kept the tree in sync between these changes)"
                }
              ' > release_commits.txt || true
            if [ -s release_commits.txt ]; then
              CHANGELOG="$(cat release_commits.txt)"
            else
              CHANGELOG="- (no commit notes could be read for this range)"
            fi
            # the vivi-music pattern: Changelog/Stablemd/<version without
            # the leading v>.md is the release body verbatim when present —
            # an empty or missing file keeps the plain commit-derived layout
            CURATED="Changelog/Stablemd/${TAG#v}.md"
            if [ -s "$CURATED" ]; then
              cat "$CURATED"
            else
              echo "FFX Compatibility Tool ${TAG} — the portable Windows build."
              echo ""
              echo "## What's changed"
              echo ""
              echo "$CHANGELOG"
            fi
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download **${EXENAME}** below — that single file is the whole app."
            echo "2. Run it — no installer, no zip, no DLL pile, no data folder: everything is inside the exe."
            echo "3. Requires .NET Framework 4.8 (preinstalled on Windows 10/11; Windows 7 SP1 needs the 4.8 runtime installed once)."
            echo '4. Windows shows a "publisher could not be verified" warning on first run — this app is unsigned open source, and Windows says that about every fresh download. Match the SHA-256 in the Verify section below, then click **Run**.'
            echo "5. If the prompt gets old: right-click the exe → Properties → tick **Unblock**."
            echo ""
            echo "## Verify"
            echo ""
            echo '```'
            echo "SHA-256  ${SUM}  ${EXENAME}"
            echo '```'
            echo ""
            if [ -s "$CURATED" ]; then
              echo "<details>"
              echo "<summary>Every change in ${TAG} — the full commit list</summary>"
              echo ""
              echo "$CHANGELOG"
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "The in-app updater (Settings → About) announces this release to installed builds automatically — it downloads the exe, checks it against the SHA-256 above, and swaps it in place; publishing a release is the whole announcement."
            if [ -s "$CURATED" ]; then
              echo ""
              echo "## Support"
              echo ""
              echo "- Found a bug or a preset that misbehaves? Open an issue: https://github.com/marbou92/FFX-Compatibility-Tool/issues — verbose logs welcome"
              echo "- Docs, screenshots and the rolling nightly: the README"
              echo "- Free, open source (MIT) and local-first — your preset files never leave your machine"
            fi
          } > release_notes.md

      - name: Check if the release already exists
        if: steps.ver.outputs.tag != ''
        id: relcheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the vivi-music guard: a re-run (a retry after a failed publish,
          # or a manual dispatch for a version that already shipped) skips
          # politely with a notice instead of dying on the create call
          if gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${{ steps.ver.outputs.tag }} already exists — skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.ver.outputs.tag != '' && steps.relcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          # a tag push: the tag exists and target_commitish is ignored.
          # a dispatch: the tag is created here, on the commit that was
          # just built and tested (API-created → no workflow re-trigger)
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FFX Compatibility Tool ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          # the exe IS the download; changelog.json rides beside it as the
          # in-app update feed (releases/latest/download/changelog.json)
          files: |
            ${{ steps.pack.outputs.exename }}
            changelog.json
          fail_on_unmatched_files: true
          generate_release_notes: true
