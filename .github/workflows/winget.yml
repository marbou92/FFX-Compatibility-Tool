# Winget — every published release offers itself to the winget-pkgs
# catalog as a reviewed update pull request.
#
# The package is listed (0.1.0 merged through the new-package PR); from
# here on every release is offered automatically, on two triggers, and
# the run never goes red while it waits:
#
#   * release published — the fast path: the newest released version is
#     submitted right away.
#   * daily schedule — the patient path: it re-checks every day, so a
#     release whose submission failed (or a catalog still trailing) is
#     picked up the next morning — no re-release, no manual step.
#
# Maintainer setup — this header is the only documentation on purpose:
# one-time token setup and submission troubleshooting are instructions
# for the maintainer, not reading for the repo's users.
#   1. GitHub → Settings → Developer settings → Personal access tokens
#      (classic) → generate a token with the `public_repo` scope. It
#      MUST be a classic token — fine-grained ones cannot fork
#      microsoft/winget-pkgs, so the submission always dies with
#      "Resource not accessible by personal access token".
#   2. Store it in this repository as the secret WINGET_SUBMIT_TOKEN.
#   3. Re-run the workflow (Actions → Winget → Run workflow) — every
#      skip is green, so re-running is always safe.
#
# Troubleshooting — every way a run can end:
#   * notice "WINGET_SUBMIT_TOKEN is not set - skipping" → the secret
#     does not exist under that exact name; create it (setup step 2).
#   * preflight "fine-grained PAT" / "none of the scopes" → replace the
#     secret with a CLASSIC PAT carrying public_repo (setup step 1).
#   * preflight 401 → the classic PAT expired or was revoked; create a
#     fresh one — No expiration keeps nightly submissions rotation-free
#     — and update the secret.
#   * notice "not in the winget-pkgs catalog yet" → safety net for a
#     missing listing; expected only while a first listing is in review.
#   * notice "already lists <version>" → nothing to do.
#
# Manual fallback (no token in CI at all), on any machine with a
# classic PAT:
#   wingetcreate update Marbou92.FFXCompatibilityTool --version <v> ^
#     --urls <the release exe URL> --submit --token <classic-PAT>
# A set-but-unusable token fails fast at the preflight below, with the
# exact fix in the error message instead of winget-create's bare
# "Resource not accessible by personal access token".

name: Winget

on:
  release:
    types: [published]
  schedule:
    - cron: "25 4 * * *" # 04:25 UTC daily — picks up anything the fast path missed
  workflow_dispatch:

permissions:
  contents: read

# a release landing next to the daily check must not double-submit
concurrency:
  group: winget

jobs:
  submit:
    name: Offer the newest release to winget-pkgs
    runs-on: windows-latest
    steps:
      - name: Install the .NET 6 runtime winget-create needs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Decide whether a submission is due
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest real release: not a draft, not a prerelease, tag v*
          # (the list is newest-first, so the first hit is the latest)
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("v")))][0].tag_name // empty' 2>/dev/null || true)"
          TAG="${TAG//\"/}"
          if [ -z "$TAG" ]; then
            echo "::notice::No real release exists yet — nothing to offer to winget-pkgs."
            echo "reason=no-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#v}"

          # has the package been accepted into the catalog at all?
          # (the first submission is a human-reviewed pull request)
          if ! gh api "repos/microsoft/winget-pkgs/contents/manifests/m/Marbou92/FFXCompatibilityTool" > /dev/null 2>&1; then
            echo "::notice::FFXCompatibilityTool is not in the winget-pkgs catalog yet — waiting. This check runs daily, so the update PR opens by itself the day the package is listed."
            echo "reason=waiting" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # is the newest release already listed?
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/m/Marbou92/FFXCompatibilityTool/$VERSION" > /dev/null 2>&1; then
            echo "::notice::winget-pkgs already lists $VERSION — nothing to do."
            echo "reason=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # due for submission — take the exe asset off that release
          URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            --jq '[.assets[] | select(.name | endswith(".exe"))][0].browser_download_url // empty')"
          if [ -z "$URL" ]; then
            echo "::error::Release $TAG has no .exe asset — build.yml should have attached FFXCompatibilityTool-$VERSION.exe."
            exit 1
          fi
          echo "reason=submit" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Submit the manifest update through winget-create
        if: steps.decide.outputs.reason == 'submit'
        shell: pwsh
        env:
          WINGET_SUBMIT_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
          ASSET_URL: ${{ steps.decide.outputs.url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_SUBMIT_TOKEN)) {
            Write-Host "::notice::WINGET_SUBMIT_TOKEN is not set - skipping the winget submission. Setup: store a classic PAT with the public_repo scope as the secret WINGET_SUBMIT_TOKEN (see the header of this file)."
            exit 0
          }

          # ---- token preflight -------------------------------------------------
          # "Resource not accessible by personal access token" deep inside
          # winget-create means the token cannot fork microsoft/winget-pkgs:
          # a fine-grained PAT (GitHub will not fork a repo its owner doesn't
          # control with one) or a classic PAT without the public_repo scope.
          # Prove the token HERE — with the fix spelled out — instead of
          # failing mid-submit after the manifest was already generated.
          if ($env:WINGET_SUBMIT_TOKEN.StartsWith('github_pat_')) {
            Write-Host "::error::WINGET_SUBMIT_TOKEN is a fine-grained PAT (github_pat_...). Fine-grained tokens cannot fork microsoft/winget-pkgs, so a submission can never succeed with one. Fix: GitHub → Settings → Developer settings → Personal access tokens (classic) → Generate new token → tick public_repo → update the WINGET_SUBMIT_TOKEN secret."
            exit 1
          }
          $headers = @{
            Authorization          = "Bearer $env:WINGET_SUBMIT_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $resp = Invoke-WebRequest -Uri 'https://api.github.com/user' -Headers $headers -SkipHttpErrorCheck -ResponseHeadersVariable rh
          } catch {
            Write-Host "::error::Could not reach api.github.com to preflight WINGET_SUBMIT_TOKEN ($($_.Exception.Message)) - the submission would fail the same way. Re-run the workflow once the API is reachable."
            exit 1
          }
          if ($resp.StatusCode -eq 401) {
            Write-Host "::error::WINGET_SUBMIT_TOKEN was rejected by GitHub (401) - the token is expired or revoked (classic PATs expire; GitHub defaults to 30 days). Fix: create a fresh classic PAT with the public_repo scope and update the WINGET_SUBMIT_TOKEN secret."
            exit 1
          }
          if ($resp.StatusCode -ne 200) {
            Write-Host "::error::GitHub answered HTTP $($resp.StatusCode) for WINGET_SUBMIT_TOKEN's identity check - the token is not usable for submissions. Fix: create a classic PAT with the public_repo scope and update the WINGET_SUBMIT_TOKEN secret."
            exit 1
          }
          # classic PATs list their scopes in X-OAuth-Scopes; fine-grained
          # tokens list none (and cannot fork winget-pkgs at all) — so a
          # scopeless answer fails here with the same fix, whatever the token kind
          $scopes = (@($rh['X-OAuth-Scopes']) -join ',')
          if ($scopes -notmatch '(^|,\s*)(repo|public_repo)(\s*,|$)') {
            Write-Host "::error::WINGET_SUBMIT_TOKEN carries none of the scopes a winget-pkgs submission needs (token scopes: '$scopes'). Forking microsoft/winget-pkgs requires a CLASSIC PAT with the public_repo scope - fine-grained tokens cannot fork a repository they don't own, which is exactly winget-create's 'Resource not accessible by personal access token'. Fix: GitHub → Settings → Developer settings → Personal access tokens (classic) → Generate new token → tick public_repo → update the WINGET_SUBMIT_TOKEN secret."
            exit 1
          }
          $login = '?'
          try { $login = ($resp.Content | ConvertFrom-Json).login } catch { }
          Write-Host "Token preflight OK - authenticated as '$login', scopes: $scopes"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          Write-Host "Offering FFX Compatibility Tool $env:VERSION to winget-pkgs: $env:ASSET_URL"
          ./wingetcreate.exe update Marbou92.FFXCompatibilityTool --version $env:VERSION --urls $env:ASSET_URL --submit --token $env:WINGET_SUBMIT_TOKEN
